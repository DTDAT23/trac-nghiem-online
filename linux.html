<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn tập Trắc nghiệm Linux (120 Câu)</title>

<style>
body{
    font-family: Segoe UI, Tahoma, sans-serif;
    background:#f0f2f5;
    max-width:900px;
    margin:auto;
    padding:20px;
    padding-right:180px;
}
h1{color:#d35400;text-align:center}
.quiz-container{
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,.1)
}
.question-item{
    margin-bottom:30px;
    padding-bottom:20px;
    border-bottom:1px dashed #ccc
}
.question-title{font-weight:600;margin-bottom:10px}
.options label{
    display:block;
    padding:10px;
    margin:5px 0;
    border:1px solid #ddd;
    border-radius:6px;
    cursor:pointer
}
.options label:hover{background:#eef2f3}
.correct-answer{background:#d4edda!important}
.wrong-answer{background:#f8d7da!important}

.btn-group{
    position:fixed;
    right:30px;
    top:120px;
    width:150px;
    background:#fff;
    padding:15px;
    border-radius:8px;
    box-shadow:0 4px 20px rgba(0,0,0,.2)
}
button{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:none;
    border-radius:5px;
    font-weight:bold;
    cursor:pointer
}
#submit-btn{background:#27ae60;color:#fff}
#reset-btn{background:#7f8c8d;color:#fff}
#result-area{
    margin-top:20px;
    padding:20px;
    font-weight:bold;
    display:none;
    text-align:center
}
img{max-width:100%;margin:10px 0}
@media(max-width:1100px){
    body{padding-right:20px}
    .btn-group{position:static;width:auto}
}
</style>
</head>

<body>

<h1>Ôn Tập Hệ Điều Hành Linux</h1>

<div class="quiz-container">
    <div id="quiz"></div>
    <div id="result-area"></div>
</div>

<div class="btn-group">
    <button id="submit-btn" onclick="submitQuiz()">Nộp bài</button>
    <button id="reset-btn" onclick="location.reload()">Làm lại</button>
</div>

<script>
const quizData = [
{q:"Phần quan trọng nhất của Linux?",a:"c",o:["File System","Services","Kernel","Shell"]},
{q:"Số phiên bản kernel Linux cũ?",a:"d",o:["Số chẵn ổn định","Số lẻ thử nghiệm","Không quan trọng","A và B đúng"]},
{q:"Cài RedHat ở chế độ nào xóa DOS?",a:"b",o:["Workstation","Server","Cả hai","Không đúng"]},
{q:"Kiến trúc Kernel Linux?",a:"d",o:["Static","Microkernel","Distributed","Monolithic"]},
{q:"Tác giả Linux?",a:"b",o:["Bill Gates","Linus Torvalds","Alan Turing","Pascal"]},
{q:"Liệt kê file?",a:"a",o:["ls","df","du","cp"]},
{q:"Chi tiết file?",a:"b",o:["-a","-l","-x","-n"]},
{q:"File ẩn?",a:"b",o:["-b","-a","-l","-n"]},
{q:"Đổi thư mục?",a:"b",o:["cdir","cd","mkdir","dir"]},
{q:"Về home nhanh?",a:"a",o:["cd","cd /home/user","cd / ; cd home","cd sinhvien"]},
{q:"Xem file văn bản?",a:"d",o:["cat","less","more","Tất cả"]},
{q:"Mount CD?",a:"a",o:["Phải mount","eject","cd /mnt","Không đọc"]},
{q:"File mount mặc định?",a:"c",o:["/etc/mtab","/etc/mount.conf","/etc/fstab","/etc/modules.conf"]},
{q:"File mount hiện tại?",a:"a",o:["/etc/mtab","/etc/fstab","/etc/group","/etc/init"]},
{q:"Quyền -rwx--x--x?",a:"d",o:["077","644","755","711"]},
{q:"Runlevel shutdown?",a:"b",o:["6","0","3","5"]},
{q:"Runlevel reboot?",a:"a",o:["6","0","3","5"]},
{q:"Runlevel đồ họa?",a:"d",o:["6","0","3","5"]},
{q:"Editor dòng lệnh phổ biến?",a:"a",o:["vi","Word","Emacs","Nano"]},
{q:"Xem tiến trình?",a:"b",o:["ls","ps","cs","ds"]},
{q:"PID là?",a:"a",o:["Process ID","User ID","Group ID","GUID"]},
{q:"Kill tiến trình?",a:"b",o:["stop","kill","halt","shutdown"]},
{q:"Cổng HTTP?",a:"b",o:["21","80","110","443"]},
{q:"Cổng SMTP?",a:"d",o:["22","23","24","25"]},
{q:"Login từ xa?",a:"d",o:["telnet","ssh","rlogin","Tất cả"]},
{q:"Cài rpm?",a:"b",o:["rpm -evh","rpm -ivh","rpm -q","rpm -qa"]},
{q:"Runlevel mặc định?",a:"c",o:["/etc/grub.conf","/etc/runlevel","/etc/inittab","/etc/init"]},
{q:"Xem hướng dẫn ls?",a:"c",o:["help ls","doc ls","man ls","info ls"]},
{q:"Xem dung lượng đĩa?",a:"c",o:["du","du -a","df","lsblk"]},
{q:"File user?",a:"a",o:["/etc/passwd","/etc/users","/etc/shadow","/etc/login"]},
{q:"User cao nhất?",a:"b",o:["admin","root","sudo","user"]},
{q:"2 ổ IDE mỗi ổ 2 partition?",a:"b",o:["sda1,sda2","hda1,hda2,hdb1,hdb2","sda...","Không đúng"]},
{q:"Kết quả chương trình shell?",a:"a",o:["Xem hình","B","C","D"],img:"cau120.png"}
];

function render(){
    let html="";
    quizData.forEach((q,i)=>{
        html+=`<div class="question-item">
        <div class="question-title">Câu ${i+1}: ${q.q}</div>`;
        if(q.img) html+=`<img src="${q.img}">`;
        q.o.forEach((op,j)=>{
            html+=`<label id="l-${i}-${j}">
            <input type="radio" name="q${i}" value="${j}"> ${"ABCD"[j]}. ${op}
            </label>`;
        });
        html+="</div>";
    });
    document.getElementById("quiz").innerHTML=html;
}

function submitQuiz(){
    let score=0;
    quizData.forEach((q,i)=>{
        const sel=document.querySelector(`input[name="q${i}"]:checked`);
        if(sel){
            if("abcd"[sel.value]===q.a) score++;
            else document.getElementById(`l-${i}-${sel.value}`).classList.add("wrong-answer");
        }
        const correctIndex="abcd".indexOf(q.a);
        document.getElementById(`l-${i}-${correctIndex}`).classList.add("correct-answer");
    });
    const r=document.getElementById("result-area");
    r.style.display="block";
    r.innerHTML=`Bạn làm đúng ${score}/${quizData.length} câu`;
}

render();
</script>

</body>
</html>
