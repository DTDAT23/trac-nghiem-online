        function renderQuiz() {
            const quizContainer = document.getElementById('quiz-content');
            let html = '';

            // Mảng chữ cái cố định để hiển thị đẹp mắt
            const fixedLabels = ['A', 'B', 'C', 'D'];

            quizData.forEach((item, index) => {
                let imageBlock = '';
                if (item.image) {
                    imageBlock = `<img src="${item.image}" class="question-image" alt="Hình minh họa câu ${item.id}">`;
                }

                // 1. Lấy danh sách key (a, b, c, d)
                let optionKeys = Object.keys(item.options);
                
                // 2. Trộn ngẫu nhiên vị trí các key
                optionKeys.sort(() => Math.random() - 0.5);

                // 3. Tạo HTML
                let optionsHtml = optionKeys.map((key, i) => {
                    // key: là mã đáp án gốc (a, b, c, d) - dùng để chấm điểm
                    // i: là số thứ tự hiển thị (0, 1, 2, 3) - dùng để gán nhãn A, B, C, D cố định
                    return `
                        <label id="lbl-${index}-${key}" style="display: flex; align-items: center;">
                            <input type="radio" name="q${index}" value="${key}" style="margin-right: 10px;"> 
                            <span><strong>${fixedLabels[i]}.</strong> ${item.options[key]}</span>
                        </label>
                    `;
                }).join('');

                html += `
                    <div class="question-item" id="question-${index}">
                        <div class="question-title">Câu ${item.id}: ${item.q.replace(/^\d+\.\s/, '')}</div>
                        ${imageBlock}
                        <div class="options" style="display: flex; flex-direction: column; gap: 10px;">
                            ${optionsHtml}
                        </div>
                    </div>
                `;
            });

            quizContainer.innerHTML = html;
        }

        function submitQuiz() {
            let score = 0;
            let unswered = 0;
            
            quizData.forEach((item, index) => {
                const selectedOption = document.querySelector(`input[name="q${index}"]:checked`);
                
                // Reset styles
                Object.keys(item.options).forEach(key => {
                    document.getElementById(`lbl-${index}-${key}`).classList.remove('correct-answer', 'wrong-answer');
                });

                // Highlight đáp án đúng
                const correctLabel = document.getElementById(`lbl-${index}-${item.a}`);
                if(correctLabel) correctLabel.classList.add('correct-answer');

                // Kiểm tra kết quả
                if (selectedOption) {
                    if (selectedOption.value === item.a) {
                        score++;
                    } else {
                        const wrongLabel = document.getElementById(`lbl-${index}-${selectedOption.value}`);
                        wrongLabel.classList.add('wrong-answer');
                    }
                } else {
                    unswered++;
                }
            });

            const resultArea = document.getElementById('result-area');
            resultArea.style.display = 'block';
            resultArea.innerHTML = `
                Kết quả: <span style="color: #27ae60">${score}</span> / ${quizData.length} câu đúng.<br>
                <span style="font-size: 0.8em; color: #7f8c8d">(Bỏ trống: ${unswered} câu)</span>
            `;
            
            resultArea.scrollIntoView({ behavior: 'smooth' });
        }

        window.onload = renderQuiz;
    </script>
