<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Ôn Tập Trắc Nghiệm</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            max-width: 800px;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        p.subtitle {
            color: #7f8c8d;
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-decoration: none;
            color: #333;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-color: #3498db;
        }
        .card-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }
        .card h2 {
            margin: 0 0 10px 0;
            color: #2980b9;
        }
        .card p {
            margin: 0;
            color: #666;
        }
        .card.linux:hover {
            border-color: #e67e22;
        }
        .card.linux h2 {
            color: #d35400;
        }
        footer {
            margin-top: 50px;
            color: #bdc3c7;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ngân Hàng Câu Hỏi Ôn Tập</h1>
        <p class="subtitle">Chọn đề thi bạn muốn ôn luyện hôm nay</p>

        <div class="menu-grid">
            <a href="banquyen.html" class="card">
                <div class="card-icon">⚖️</div>
                <h2>Bản Quyền & Mã Nguồn Mở</h2>
                <p>50 câu hỏi trắc nghiệm</p>
                <p style="font-size: 0.8em; margin-top: 10px; color: #aaa;">Luật SHTT, GPL, BSD, Lịch sử FOSS...</p>
            </a>

            <a href="linux.html" class="card linux">
                <div class="card-icon">🐧</div>
                <h2>Hệ Điều Hành Linux</h2>
                <p>120 câu hỏi trắc nghiệm</p>
                <p style="font-size: 0.8em; margin-top: 10px; color: #aaa;">Lệnh cơ bản, Quản trị hệ thống, Network...</p>
            </a>
        </div>

        <footer>
            Chúc bạn ôn tập tốt!
        </footer>
    </div>

</body>
</html>
